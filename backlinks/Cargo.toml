[package]
name = "backlink-opportunities-detector"
version = "0.1.0"
edition = "2021"
rust-version = "1.99.0"
description = "Opt-in backlink opportunities detector for Astro sites: evidence-backed unlinked brand mentions, curated resource-page leads, and verified broken-link replacement possibilities. Standalone JSON CLI; never runs during Astro builds."
license = "MIT"
authors = ["naoufac"]
repository = "https://github.com/naoufac/astro-cms-internal-link-structure"

# Independent workspace: intentionally NOT a member of the parent crate's
# workspace. All Cargo state (lockfile, target dir) stays under backlinks/.
[workspace]

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
idna = "1"
percent-encoding = "2.3"
url = "2.5"
scraper = "0.27"
ego-tree = "0.9"
robots_txt = "0.7"
reqwest = { version = "0.12", default-features = false, features = [
  "blocking",
  "rustls-tls-native-roots",
  "gzip",
  "brotli",
] }
unicode-segmentation = "1.12"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
